# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: CI pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Build with Maven
        run: mvn clean javafx:run

  check-style:
    runs-on: ubuntu-latest
    permissions: read-all

    steps:
      - name: Lint Java with Checkstyle
        # You may pin to the exact commit or the version.
        # uses: motlin/checkstyle-results@c92e0239f18f0f28d862f227df2dd3bc0a768f9e
        uses: motlin/checkstyle-results@v1.2.0
        with:
          # Glob to locate Checkstyle XML reports (Defaults to **/checkstyle-result.xml)
          checkstyle_files: # optional, default is **/checkstyle-result.xml       npm create stylelint@17.4.0


      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint CSS with Stylelint
        uses: reviewdog/action-stylelint@dd2b435cc6a7c82705307a9dee740c9bbaa10411 # v1.30.2
        with:
          reporter: github-pr-review # Change reporter.
          stylelint_input: '**/*.css'
      - name: Lint CSS with Stylelint
        uses: actions-hub/stylelint@master 

